[project]
name = "pulse-research-api"
version = "2.0.0"
description = "A-share market research, transparent factors and reproducible experiments"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "polars>=2,<3",
    "duckdb>=1.1,<2",
    "pyarrow>=17,<30",
    "pydantic>=2.8,<3",
    "httpx>=0.27,<1",
    "mcp>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[project.optional-dependencies]
akshare = ["akshare>=1.15"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["..", "."]

