[project]
name = "pulse3"
version = "3.2.0"
description = "Pulse A-share stock selection and trade-plan platform, v3.2 clean rewrite"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "polars>=1.20",
  "duckdb>=1.1",
  "pyarrow>=18",
  "httpx>=0.28",
  "jsonschema==4.26.0",
  "referencing>=0.35",
  "tzdata",
]

[dependency-groups]
dev = ["pytest>=8", "pglast==8.7", "openapi-spec-validator==0.7.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/db"]
markers = ["pg: needs a real PostgreSQL (PULSE_TEST_DSN)"]
